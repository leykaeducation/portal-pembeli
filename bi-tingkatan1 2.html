<style>

#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}

button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:17px;color:#fff;background:var(--pri);box-shadow:0 4px 0 rgba(0,0,0,.2)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.b3{background:var(--sun);color:#3a2a00}.b4{background:var(--ok)}.b5{background:#6c5ce7}
.bk{padding:8px 14px;background:#6c5ce7;align-self:flex-start}
.tm{font-weight:800;font-size:14px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.75);color:#1d2b53;align-self:flex-start}
.un{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px}
.un .tx{flex:1;line-height:1.25}.un small{display:block;opacity:.7;font-size:12px}.un .bt{display:flex;gap:6px}.un .bt button{padding:9px 11px;font-size:16px}
.sub{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.bar{height:12px;border-radius:6px;background:rgba(0,0,0,.12);overflow:hidden}.bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.sec{font-weight:800;font-size:14px;color:var(--pri)}
.q{font-size:19px;font-weight:800;line-height:1.45;text-align:left}
.ans{display:grid;grid-template-columns:1fr;gap:10px}
.ans button{background:var(--card);color:var(--ink);border:3px solid var(--line);font-size:17px;text-align:left;min-height:50px;box-shadow:none}
.ans button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.ans button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.sh{animation:sh .35s}@keyframes sh{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.fb{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:14px;text-align:left;line-height:1.5}
.nx{width:100%;margin-top:10px;background:var(--ok)}
input,textarea{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:14px;border:3px solid var(--line);background:transparent;color:var(--ink)}
textarea{min-height:170px;resize:vertical}
.nt{text-align:left;line-height:1.55;font-size:16px}.nt p{margin:8px 0;padding:10px;border-radius:12px;background:rgba(59,130,246,.12);opacity:1}
.nt b{display:block;margin-top:6px}
.ck{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:6px 0;font-size:16px}.ck input{width:24px;height:24px;margin:0;flex:none}
.st{font-size:40px;letter-spacing:5px}
.row{display:flex;gap:8px;text-align:left;padding:8px 0;border-bottom:2px dashed var(--line);font-size:15px;line-height:1.4}
.pb{height:10px;background:rgba(0,0,0,.12);border-radius:5px;overflow:hidden;margin-top:4px}.pb i{display:block;height:100%;background:var(--ok)}
details summary{cursor:pointer;text-align:left}.ans button:disabled{opacity:.4}
@media (prefers-reduced-motion:reduce){html,#fx span{animation:none}}
</style>

var NOTE={NN:'A common noun is a general name (teacher, city). A proper noun is a specific name and begins with a capital letter (Malaysia, Siti, Monday).',ART:'Use “a” before a consonant sound (a book, a uniform) and “an” before a vowel sound (an apple, an hour). Listen for the sound, not the letter.',SP:'The simple present is for habits and facts. The subjects he, she, it and singular names take verb + s/es (She plays). Other subjects use the base verb (They play). Signal words: every day, always, on Sundays.',YN:'A yes/no question begins with Do, Does, Is or Are. Do/Does is for the simple present (Does she like durians?). Is/Are is for sentences with be (Is he a doctor?).',VR:'The simple past is for things that already happened (yesterday, last week, ago). Regular verbs add -ed (walk → walked). Irregular verbs change form (go → went, eat → ate).',CU:'Countable nouns can be counted (books, eggs): use many, a few. Uncountable nouns cannot be counted (milk, rice, money): use much, a little. Questions: How many books? How much milk?',PL:'Plural nouns: add -s (book → books); -es for s, x, ch, sh (box → boxes); consonant + y becomes -ies (baby → babies). Irregular: child → children, man → men, tooth → teeth.',SVA:'Subject-verb agreement: a singular subject takes a singular verb (She is, He has). A plural subject takes a plural verb (They are, The boys have).',PRON:'Possessive pronouns: mine, yours, his, hers, ours, theirs. Demonstratives: this/that (singular), these/those (plural). Interrogatives: what, who, whose, where.',AUX:'An auxiliary verb helps the main verb: do/does/did (questions and negatives), have/has (completed actions), is/am/are + -ing (actions happening now).',CONJ:'A conjunction joins ideas: and (addition), but (contrast), or (choice), so (result), because (reason). It rained, so we stayed home. We stayed home because it rained.',ADV:'An adverb describes a verb: manner (quickly, carefully), time (yesterday, tomorrow), place (outside, there). Adverbs of manner usually end in -ly.',PREP:'Prepositions of place: in, on, at, between. Of time: at (clock time), on (days), in (months, years). Direction: across, into. A phrasal verb is verb + particle: take off, turn on.',ADJ:'An adjective describes a noun (a tall boy). Possessive adjectives: my, his, her, our, their. Comparative: taller than. Superlative: the tallest. Long adjectives: more interesting, the most interesting.',FUT:'Future tense: will + verb (I will visit) or am/is/are going to + verb (It is going to rain). Signal words: tomorrow, next week.',PUNC:'Use a capital letter at the start of a sentence and for proper nouns. A full stop (.) ends a statement, a question mark (?) ends a question, an exclamation mark (!) shows strong feeling, a comma (,) separates items in a list.',MOD:'Modals: can (ability), may (permission), might (possibility). Use the base verb after a modal: She can swim.',QF:'Positive question: Do you like fish? Negative question: Don’t you like fish? A choice question gives options with or: Do you want tea or coffee?',SIM:'A simile compares two things with as...as or like: as busy as a bee, as brave as a lion.',VOC:'Use a dictionary to find the meaning of words (alphabetical order). Synonyms have the same meaning (big, large). Antonyms have opposite meanings (hot, cold).',SOUND:'Short and long vowel sounds change meaning: the “i” in ship is short, but the “ee” in sheep is long. A diphthong is two vowel sounds joined (boy, house). Listen and say the words carefully.',SKILL:'Skimming: read quickly to get the general idea. Scanning: look for specific information. The main idea is the most important point. i-THINK maps: circle map (definition), bubble map (describing), double bubble (comparing), flow map (sequence), tree map (classifying), multi-flow (cause and effect).',LIT:'A poem has stanzas and rhyme. A short story has a setting, characters, plot and moral value. A graphic novel tells a story with pictures and text. A drama is divided into acts and scenes.'};
var FMT={PO:['Poster','Big title · Slogan · Details (what, when, where) · Icon or picture · Contact information',['Has an attractive title and slogan','Has key details (what, when, where)','Short and clear sentences'],'imperative and present','TITLE: ______ ! / SLOGAN: ______ / What: ______ / When: ______ / Where: ______ / Join us: ______'],SL:['Slogan','1 short, memorable sentence. Use a command or a rhyme.',['Short (fewer than 10 words)','Memorable (rhyme or command)','Related to the topic'],'imperative','Example: Save today, smile tomorrow!'],EM:['Email','To and Subject · Greeting · Opening · Body (paragraphs) · Closing · Name',['Has To, Subject and Greeting (Dear ...)','Has an opening, body and closing','Language suits the reader'],'present and past','To: ____ / Subject: ____ / Dear ____, / I hope you are well. I am writing to ____. / First, ____. Second, ____. / Please reply soon. / Best wishes, ____'],JN:['Journal','Date · Dear Journal · Event · Feelings · Lesson',['Has a date and Dear Journal','Uses past tense and first person (I)','Has feelings and a lesson'],'past tense','Date: ____ / Dear Journal, / Today I ____. First, ____. Then, ____. I felt ____ because ____. I learnt that ____.'],ED:['E-diary','Date and time · Short paragraph · Feelings · Plans for tomorrow',['Has a date and time','Written in the first person (I)','Has feelings or plans for tomorrow'],'past tense','12 Nov, 9.30 p.m. / Today I ____. I felt ____ because ____. Tomorrow I will ____.'],LT:['Letter','Address · Date · Dear ... · Opening · Body · Closing (Yours sincerely / Your friend)',['Has an address, date and greeting (Dear ...)','Body is organised in paragraphs','Has a correct closing'],'present and past','(Your address) / (Date) / Dear ____, / I am writing to ____. / (Paragraph 1) / (Paragraph 2) / Yours sincerely, ____'],CP:['Captions','1 short phrase or sentence under each picture.',['One caption for each picture','Short and clear','Suits the picture and the topic'],'present','Picture var GN=['Objective questions: read the question twice and underline the keywords (subject, time, question type). Remove the wrong options first. Check tense and subject-verb agreement.','Subjective questions: “Complete / Fill in” = write one word or the correct verb form. “Rewrite” = rewrite the sentence with the requested change without changing the meaning. “Correct” = fix the mistake. “State / Name / List” = give a short answer. “Why” = answer with because.','Reading questions: find the question word (Who, What, When, Where, Why, How many) and look for the same keywords in the text. Answer with accurate information.','Essays: analyse the question first. Format (type of writing), Audience (who will read it), Tense, Purpose and Points (required content). Plan with a mind map, write following the format, then check spelling and punctuation.','Usual mark breakdown: content, language, and format and organisation. Answer all the required points and stay on topic.'];

var CONJ=st(['I like tea ___ I do not like coffee.|but|and|or|because','Would you like rice ___ noodles for lunch?|or|and|but|so','She was tired, ___ she went to bed early.|so|but|or|because','He stayed at home ___ it was raining.|because|so|but|or','Ali plays football ___ badminton after school.|and|but|so|because','I wanted to buy the shirt, ___ it was too expensive.|but|and|so|or','We missed the bus, ___ we walked to school.|so|because|or|but','You can take the bus ___ the train.|or|so|because|but','She is happy ___ she won the first prize.|because|so|but|or','It was raining heavily, ___ the match was cancelled.|so|because|or|but','I have a brother ___ a sister.|and|but|so|because','He studied hard, ___ he failed the test.|but|so|because|and'],'CONJ');

  h+='<div class="card un"><div class="tx"><b>Chapter '+u+'</b> '+e(t[0])+(b>=21?' ✅':'')+'<small>'+e(t[1])+' · '+(l.length?l.length+' attempts · Best '+b+'/30':'Not played yet')+'</small></div><div class="bt"><button class="b5" onclick="nt('+u+')">📘</button><button onclick="go('+u+')">▶️</button><button class="b3" onclick="hist('+u+')">📒</button></div></div>'});
 A.innerHTML=h;scrollTo(0,0)}
function req(){A.innerHTML='<button class="bk" onclick="menu()">⬅️ Back</button><div class="card nt"><h2>📋 Question Requirements</h2>'+GN.map(s=>'<p>'+e(s)+'</p>').join('')+'<b>Essay formats</b>'+Object.keys(FMT).map(k=>'<p><b>'+FMT[k][0]+'</b>'+e(FMT[k][1])+'<br>Tense: '+FMT[k][3]+'<br><i>'+e(FMT[k][4])+'</i></p>').join('')+'</div>';scrollTo(0,0)}
function nt(u){var ks=CH[u-1][2].split(' '),f={};WP[u-1].forEach(w=>f[w[0]]=1);
  A.innerHTML='<button class="bk" onclick="menu()">⬅️ Back</button><div class="card"><p>'+e(CH[u-1][1])+'</p><h2>Chapter '+u+': '+e(CH[u-1][0])+'</h2></div><div class="card nt"><b>📘 Quick Notes</b>'+ks.map(k=>'<p>'+e(NOTE[k])+'</p>').join('')+'<b>✍️ Special Notes: Essay Question Requirements</b>'+Object.keys(f).map(k=>'<p><b>'+FMT[k][0]+'</b>'+e(FMT[k][1])+'<br>Tense: '+FMT[k][3]+'<br><i>'+e(FMT[k][4])+'</i></p>').join('')+'<p>'+e(GN[3])+'</p><button class="b5" onclick="req()">📋 All question requirement notes</button></div><button class="b4" onclick="go('+u+')">▶️ Start 30 Questions</button>';scrollTo(0,0)}
function go(u){C={u:u,q:build(u),i:0,a:0,b:0,c:0,t0:Date.now(),w:[]};show()}
function sec(t){return t=='m'?'Part A · Objective':t=='s'?'Part B · Subjective':'Part C · Essay'}
function hd(){return '<div class="top"><button class="bk" onclick="menu()">⬅️</button><span>'+(C.lb||'Chapter '+C.u)+'</span><span>'+(C.i+1)+'/'+C.q.length+'</span><span>⭐ '+Math.round((C.a+C.b+C.c)*10)/10+'</span></div><div class="bar"><i style="width:'+C.i/C.q.length*100+'%"></i></div>'}
function show(){if(C.i>=C.q.length)return end();var q=C.q[C.i];C.lock=0;C.tr=0;C.cur=q;var h=hd()+'<div class="sec">'+sec(q.t)+'</div>';
  if(q.t=='m')h+='<div class="card q">'+e(qt(q.q))+'</div><div class="ans">'+q.o.map((o,i)=>'<button onclick="pk('+i+')">'+e(o)+'</button>').join('')+'</div><div id="fb"></div>';
  else if(q.t=='s')h+='<div class="card q">'+e(qt(q.q))+'</div><input id="in" autocomplete="off" autocapitalize="off" placeholder="Type your answer"><button onclick="chk()">✅ Check</button><div id="fb"></div>';
  else{var f=FMT[q.f];h+='<div class="card q">'+e(qt(q.q))+'</div><div class="card nt"><b>📋 Question requirements</b><p>Format: '+f[0]+'<br>Audience: '+q.au+'<br>Tense: '+f[3]+'<br>Structure: '+e(f[1])+'</p></div>'+(q.hp?'<div class="card nt"><b>🆘 Help</b><p>'+e(qt(q.hp))+'</p></div>':'')+COACH+'<textarea id="in" oninput="wc()" placeholder="Write your answer here"></textarea><div id="wc" style="text-align:right;font-size:14px">0 words</div><div class="card"><b>Self-check:</b>'+f[2].concat(['All the required points are answered','Tense and subject-verb agreement are correct','Spelling, capital letters and punctuation are checked']).map((t,i)=>'<label class="ck"><input type="checkbox" class="cb"><span>'+e(t)+'</span></label>').join('')+'</div><button class="b5" onclick="frame()">💡 View outline</button><div id="fb"></div><button class="nx" onclick="ess()">'+(C.i+1>=C.q.length?'See Results 🏁':'Next ➡️')+'</button>'}
  A.innerHTML=h;scrollTo(0,0)}
function nx(){return '<button class="nx" onclick="C.i++;show()">'+(C.i+1>=C.q.length?'See Results 🏁':'Next ➡️')+'</button>'}
function wc(){var n=document.getElementById('in').value.trim().split(/\s+/).filter(Boolean).length;document.getElementById('wc').textContent=n+' words'}
function frame(){var f=FMT[C.cur.f];document.getElementById('fb').innerHTML='<div class="fb nt"><b>Outline '+f[0]+'</b><p>'+e(f[4])+'</p></div>'}
function hist(u){var l=H[u]||[],b=l.reduce((m,x)=>Math.max(m,x.p),0),av=l.length?Math.round(l.reduce((m,x)=>m+x.p/30,0)/l.length*100):0;
  var h='<button class="bk" onclick="menu()">⬅️ Back</button><div class="card"><h2>📒 History: Chapter '+u+'</h2><p>'+e(CH[u-1][0])+'</p><p>'+l.length+' attempts · Best '+b+'/30 · Average '+av+'%</p></div>';
  if(!l.length)h+='<div class="card"><p>No activity for this chapter yet. Let’s try! 🚀</p></div>';
  else h+='<div class="card"><b>Recent attempts</b>'+l.map((x,i)=>'<div class="row"><span style="flex:1">'+(i?'':'🆕 ')+new Date(x.t).toLocaleString('en-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'<br><b>'+x.p+'/30</b> · A '+x.a+'/20 · B '+x.b+'/8 · C '+x.c+'/2 · '+tm(x.sec)+'<div class="pb"><i style="width:'+x.p/30*100+'%"></i></div></span></div>').join('')+'</div>';
  A.innerHTML=h+'<button class="b4" onclick="go('+u+')">▶️ Play Chapter '+u+'</button>';scrollTo(0,0)}
(function(){var f=document.createElement('div');f.id='fx';var E=['📚','✏️','⭐','🔤','✨','📖','🌍','🎈'];for(var i=0;i<14;i++){var s=document.createElement('span');s.textContent=E[i%E.length];s.style.cssText='left:'+Math.random()*95+'%;font-size:'+(20+Math.random()*24)+'px;animation-duration:'+(14+Math.random()*14)+'s;animation-delay:-'+Math.random()*20+'s';f.appendChild(s)}document.body.prepend(f)})();
menu();
</script>
</body>
</html>
