function getSubj(u){
 if(!SJ[1]){
  var rnd=mul(20261118),pools={};
  var shf=a=>{a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a};
  Object.keys(GP).forEach(k=>pools[k]=shf(GP[k]));
  var seen={};
  var take=k=>{var p=pools[k];while(p&&p.length){var x=p.shift();if(!x.u&&!seen[x.q]){x.u=1;seen[x.q]=1;return x}}return null};
  for(var n=1;n<=36;n++){
   var keys=[];UN[n-1][1].split(' ').forEach(k=>{if(k.charAt(0)=='J')k.split(':')[1].split(',').forEach(c=>keys.push('J:'+c));else keys.push(k)});
   var gen=[],prog=1;
   while(gen.length<10&&prog){prog=0;keys.forEach(k=>{if(gen.length<10){var x=take(k);if(x){gen.push(x);prog=1}}})}
   var rest=shf(Object.keys(pools));
   while(gen.length<10&&rest.length){var x=take(rest[0]);if(x)gen.push(x);else rest.shift()}
   var sp2=spec(n),out=[];
   for(var i=0;i<10;i++){if(gen[i])out.push({q:gen[i].q,a:gen[i].a});out.push(sp2[i])}
   SJ[n]=out;
  }
 }
 return SJ[u]}

 A.innerHTML=h+'<button class="b5" onclick="nt('+u+')">📘 Nota Unit '+u+'</button><button onclick="menu()">🏠 Senarai Unit</button>';scrollTo(0,0)}
